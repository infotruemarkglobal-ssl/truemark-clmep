name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    # A local, disposable Postgres — used ONLY as scratch space for the schema-drift
    # check below. It holds no real data and is never touched by the test suite,
    # which runs against the real Neon CI branch (TEST_DIRECT_URL secret) so it
    # exercises the actual driver adapter and Postgres behavior the app runs on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clmep_ci
          # Superuser must be named "postgres" — migration 20260422000010_rls_app_role
          # grants neondb_app TO postgres and sets ALTER DEFAULT PRIVILEGES FOR ROLE
          # postgres, matching Neon's superuser name in production. A differently-named
          # superuser here would make that migration fail replaying against this scratch DB.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: clmep_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clmep_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # GitHub Actions forbids reading `secrets` directly inside step `if:`
    # conditions — it's only usable in `env:`/`with:`. Route it through a
    # job-level env var (env context IS allowed in `if:`) so the two test
    # steps below can check whether the secret exists without failing to
    # parse the workflow.
    env:
      HAS_TEST_SECRETS: ${{ secrets.TEST_DIRECT_URL != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      # The check this workflow exists for: schema.prisma and the committed migration
      # history must always describe the same database. If someone edits
      # schema.prisma without generating a migration (or runs `prisma db push`
      # instead of `migrate dev`), this fails the build here — instead of a real
      # user finding a "column does not exist" 500 in production, which is exactly
      # what happened before this check existed. Uses the disposable local Postgres
      # purely as scratch space to compute the diff; touches no real data.
      - name: Check schema/migration drift
        env:
          # prisma.config.ts requires DIRECT_URL/DATABASE_URL to be set just to load
          # (even though this command never connects to it — only SHADOW_DATABASE_URL
          # is actually used, as the scratch DB the diff is computed against).
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SHADOW_DATABASE_URL: postgresql://postgres:clmep_ci_password@localhost:5432/clmep_ci
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --script \
            --exit-code

      # Runs against the real Neon CI branch — matches this repo's existing
      # TEST_DATABASE_URL/TEST_DIRECT_URL convention (see prisma.config.ts and the
      # __tests__/*.integration.test.ts files, which read TEST_DATABASE_URL
      # directly). Keeps migrations on that branch current before testing against it.
      #
      # Skips cleanly (does not fail the build) until TEST_DIRECT_URL /
      # TEST_DATABASE_URL / AUTH_SECRET are added as repo secrets — see the
      # warning below. Remove the `if:` guards once they're configured.
      - name: Apply migrations to the CI test database
        if: ${{ env.HAS_TEST_SECRETS == 'true' }}
        env:
          TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Run tests
        if: ${{ env.HAS_TEST_SECRETS == 'true' }}
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: npm run test:ci

      - name: Warn if tests were skipped
        if: ${{ env.HAS_TEST_SECRETS != 'true' }}
        run: |
          echo "::warning::Automated tests were SKIPPED — TEST_DIRECT_URL repo secret is not configured. Add TEST_DATABASE_URL, TEST_DIRECT_URL, and AUTH_SECRET as repo secrets to enable them."
